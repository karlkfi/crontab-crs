# root-sync.yaml
apiVersion: configsync.gke.io/v1alpha1
kind: RootSync
metadata:
  name: root-sync
  namespace: config-management-system
  annotations:
    configsync.gke.io/deletion-propagation-policy: Foreground
spec:
  sourceFormat: unstructured
  override:
    resources:
    - containerName: "reconciler"
      memoryLimit: 1000Mi
  git:
    repo: https://github.com/karlkfi/crontab-crs
    branch: karl-test-max-object-count
    dir: configs
    auth: none
  override:
    statusMode: disabled
